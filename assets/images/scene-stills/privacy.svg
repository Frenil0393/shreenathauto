<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 620"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Privacy — a secure padlock</title>
  <desc id="desc">
    A softly rounded sage padlock with a warm brass shackle and a recessed keyhole, matching the
    privacy sculpture.
  </desc>
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffdf4" />
      <stop offset="1" stop-color="#e4e0cf" />
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b8c5a6" />
      <stop offset="1" stop-color="#8c9f7d" />
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d48b6b" />
      <stop offset="1" stop-color="#aa573c" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eddbab" />
      <stop offset=".5" stop-color="#d5b980" />
      <stop offset="1" stop-color="#ad8e57" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e5eeea" stop-opacity=".72" />
      <stop offset=".55" stop-color="#a8c1b7" stop-opacity=".4" />
      <stop offset="1" stop-color="#d7e6de" stop-opacity=".65" />
    </linearGradient>
    <radialGradient id="skin" cx=".3" cy=".2" r=".9">
      <stop stop-color="#d6a17c" />
      <stop offset="1" stop-color="#a57152" />
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0" />
      <stop offset=".17" stop-color="white" />
      <stop offset=".78" stop-color="white" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="street-fade"><rect width="800" height="620" fill="url(#fade)" /></mask>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-9 400 310)">
      <path
        d="M318 292V216C318 106 482 106 482 216V292"
        fill="none"
        stroke="#b09462"
        stroke-width="29"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M313 285V209C313 103 477 103 477 209V285"
        fill="none"
        stroke="url(#gold)"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <rect x="272" y="258" width="276" height="218" rx="37" fill="#819477" />
      <rect x="259" y="243" width="276" height="218" rx="37" fill="url(#sage)" />
      <path
        d="M292 260H496"
        fill="none"
        stroke="#d3ddc1"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="397" cy="333" r="18" fill="#354237" />
      <path d="M389 343H405L411 378Q397 387 383 378Z" fill="#354237" />
    </g>
  </g>
</svg>
