<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 620"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Cookies — preference switches</title>
  <desc id="desc">
    Three rounded sage and clay preference switches with ivory knobs. A static illustration; these
    are not consent controls.
  </desc>
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffdf4" />
      <stop offset="1" stop-color="#e4e0cf" />
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b8c5a6" />
      <stop offset="1" stop-color="#8c9f7d" />
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d48b6b" />
      <stop offset="1" stop-color="#aa573c" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eddbab" />
      <stop offset=".5" stop-color="#d5b980" />
      <stop offset="1" stop-color="#ad8e57" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e5eeea" stop-opacity=".72" />
      <stop offset=".55" stop-color="#a8c1b7" stop-opacity=".4" />
      <stop offset="1" stop-color="#d7e6de" stop-opacity=".65" />
    </linearGradient>
    <radialGradient id="skin" cx=".3" cy=".2" r=".9">
      <stop stop-color="#d6a17c" />
      <stop offset="1" stop-color="#a57152" />
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0" />
      <stop offset=".17" stop-color="white" />
      <stop offset=".78" stop-color="white" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="street-fade"><rect width="800" height="620" fill="url(#fade)" /></mask>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-13 400 310)">
      <rect x="249" y="176" width="311" height="77" rx="38" fill="#819477" />
      <rect x="240" y="168" width="311" height="77" rx="38" fill="url(#sage)" />
      <circle cx="284" cy="208" r="29" fill="#819477" />
      <circle cx="281" cy="203" r="29" fill="url(#ivory)" />
      <path
        d="M492 205H516"
        fill="none"
        stroke="#d7e0c9"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <rect x="249" y="283" width="311" height="77" rx="38" fill="#975138" />
      <rect x="240" y="275" width="311" height="77" rx="38" fill="url(#clay)" />
      <circle cx="508" cy="315" r="29" fill="#975138" />
      <circle cx="505" cy="310" r="29" fill="url(#ivory)" />
      <path
        d="M270 312H294"
        fill="none"
        stroke="#e9b79a"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <rect x="249" y="390" width="311" height="77" rx="38" fill="#819477" />
      <rect x="240" y="382" width="311" height="77" rx="38" fill="url(#sage)" />
      <circle cx="284" cy="422" r="29" fill="#819477" />
      <circle cx="281" cy="417" r="29" fill="url(#ivory)" />
      <path
        d="M492 419H516"
        fill="none"
        stroke="#d7e0c9"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
  </g>
</svg>
