<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 620"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Terms — documents and a pen</title>
  <desc id="desc">
    Layered ivory documents with rounded edges, a clay signature and a clay-and-brass pen, matching
    the terms sculpture.
  </desc>
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffdf4" />
      <stop offset="1" stop-color="#e4e0cf" />
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b8c5a6" />
      <stop offset="1" stop-color="#8c9f7d" />
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d48b6b" />
      <stop offset="1" stop-color="#aa573c" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eddbab" />
      <stop offset=".5" stop-color="#d5b980" />
      <stop offset="1" stop-color="#ad8e57" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e5eeea" stop-opacity=".72" />
      <stop offset=".55" stop-color="#a8c1b7" stop-opacity=".4" />
      <stop offset="1" stop-color="#d7e6de" stop-opacity=".65" />
    </linearGradient>
    <radialGradient id="skin" cx=".3" cy=".2" r=".9">
      <stop stop-color="#d6a17c" />
      <stop offset="1" stop-color="#a57152" />
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0" />
      <stop offset=".17" stop-color="white" />
      <stop offset=".78" stop-color="white" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="street-fade"><rect width="800" height="620" fill="url(#fade)" /></mask>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-8 400 310)">
      <rect x="258" y="148" width="224" height="325" rx="18" fill="#819477" />
      <rect x="249" y="139" width="224" height="325" rx="18" fill="#d9dfcf" />
      <rect x="238" y="126" width="224" height="325" rx="18" fill="url(#ivory)" />
      <rect x="265" y="157" width="72" height="7" rx="3" fill="#bd6848" />
      <rect x="265" y="208" width="165" height="5" rx="2.5" fill="#b4b9a9" />
      <rect x="265" y="239" width="165" height="5" rx="2.5" fill="#b4b9a9" />
      <rect x="265" y="270" width="165" height="5" rx="2.5" fill="#b4b9a9" />
      <rect x="265" y="301" width="103" height="5" rx="2.5" fill="#b4b9a9" />
      <path
        d="M274 390Q287 363 291 389Q299 407 316 383Q320 379 329 389Q340 399 353 385"
        fill="none"
        stroke="#bd6848"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <g transform="translate(536 167) rotate(18)">
        <rect x="0" y="0" width="21" height="239" rx="10" fill="#975138" />
        <rect x="-5" y="-6" width="21" height="237" rx="10" fill="url(#clay)" />
        <rect x="-5" y="11" width="21" height="20" rx="4" fill="url(#gold)" />
        <path
          d="M10 22V72"
          fill="none"
          stroke="#d5b980"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path d="M-5 225H16L6 258Z" fill="url(#gold)" />
        <path d="M2 249L6 258 10 249Z" fill="#56604d" />
      </g>
    </g>
  </g>
</svg>
