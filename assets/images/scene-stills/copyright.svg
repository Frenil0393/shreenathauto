<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 620"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Copyright — a bound folio and stamp</title>
  <desc id="desc">
    A rounded ivory folio with a brass binding, embossed copyright symbol, clay bookmark and a
    separate rubber stamp.
  </desc>
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffdf4" />
      <stop offset="1" stop-color="#e4e0cf" />
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b8c5a6" />
      <stop offset="1" stop-color="#8c9f7d" />
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d48b6b" />
      <stop offset="1" stop-color="#aa573c" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eddbab" />
      <stop offset=".5" stop-color="#d5b980" />
      <stop offset="1" stop-color="#ad8e57" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e5eeea" stop-opacity=".72" />
      <stop offset=".55" stop-color="#a8c1b7" stop-opacity=".4" />
      <stop offset="1" stop-color="#d7e6de" stop-opacity=".65" />
    </linearGradient>
    <radialGradient id="skin" cx=".3" cy=".2" r=".9">
      <stop stop-color="#d6a17c" />
      <stop offset="1" stop-color="#a57152" />
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0" />
      <stop offset=".17" stop-color="white" />
      <stop offset=".78" stop-color="white" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="street-fade"><rect width="800" height="620" fill="url(#fade)" /></mask>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-7 400 310)">
      <rect x="252" y="136" width="236" height="338" rx="20" fill="#354237" />
      <rect x="261" y="141" width="221" height="319" rx="14" fill="#d9dfcf" />
      <path
        d="M272 449H470M272 454H470"
        fill="none"
        stroke="#b8c1ac"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <rect x="245" y="126" width="229" height="320" rx="17" fill="url(#ivory)" />
      <rect x="245" y="126" width="21" height="320" rx="10" fill="url(#gold)" />
      <rect x="287" y="165" width="96" height="6" rx="3" fill="#56604d" />
      <rect x="287" y="182" width="132" height="4" rx="2" fill="#a5b695" />
      <circle cx="361" cy="290" r="54" fill="none" stroke="#c38360" stroke-width="6" />
      <path
        d="M380 273C347 242 321 287 345 310Q362 324 380 308"
        fill="none"
        stroke="#bd6848"
        stroke-width="10"
      />
      <path d="M409 391H440V470L424 458 409 470Z" fill="url(#clay)" />
      <g transform="translate(552 375) rotate(9)">
        <rect x="-49" y="16" width="98" height="23" rx="8" fill="#b09462" />
        <rect x="-49" y="8" width="98" height="23" rx="8" fill="url(#gold)" />
        <rect x="-13" y="-63" width="26" height="76" rx="9" fill="#56604d" />
        <rect x="-36" y="-103" width="72" height="54" rx="21" fill="#975138" />
        <rect x="-40" y="-110" width="72" height="54" rx="21" fill="url(#clay)" />
      </g>
    </g>
  </g>
</svg>
